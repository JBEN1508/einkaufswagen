name: probe
on: { push: { branches: [probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe.mjs
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: out, retention-days: 1 }
